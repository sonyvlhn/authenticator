# docker-compose.yml
# As credenciais vêm do arquivo .env (o Docker Compose lê o .env da raiz automaticamente).
# A sintaxe ${VAR:?mensagem} impede que os containers subam se a variável não estiver definida.
services:
  postgres:
    image: postgres:18.4
    container_name: POSTGRES_DB
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:?Defina DB_USER no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      POSTGRES_DB: ${DB_NAME:?Defina DB_NAME no .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql # mantém os dados do banco mesmo se o container for recriado
    networks:
      - rededb

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Defina PGADMIN_EMAIL no .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Defina PGADMIN_PASSWORD no .env}
    ports:
      - "8080:80"
    depends_on:
      - postgres
    networks:
      - rededb

  # Armazenamento de imagens compatível com S3 (SeaweedFS)
  # API S3 em http://localhost:8333 - as imagens ficam públicas em http://localhost:8333/<bucket>/<arquivo>
  storage:
    image: chrislusf/seaweedfs:3.97
    container_name: storage
    restart: always
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?Defina STORAGE_ACCESS_KEY no .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Defina STORAGE_SECRET_KEY no .env}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?Defina STORAGE_BUCKET no .env}
    entrypoint: ["/bin/sh", "-c"]
    # Gera a configuração de acesso a partir das variáveis de ambiente (nenhuma chave fica salva no repositório):
    # - identidade "app": usada pelo backend para enviar/remover imagens
    # - identidade "anonymous": qualquer pessoa pode apenas ler as imagens do bucket (sem listar ou enviar)
    command:
      - |
        cat > /etc/seaweedfs/s3.json <<EOF
        {
          "identities": [
            {
              "name": "app",
              "credentials": [{ "accessKey": "$${STORAGE_ACCESS_KEY}", "secretKey": "$${STORAGE_SECRET_KEY}" }],
              "actions": ["Admin", "Read", "List", "Tagging", "Write"]
            },
            { "name": "anonymous", "actions": ["Read:$${STORAGE_BUCKET}"] }
          ]
        }
        EOF
        exec weed server -dir=/data -ip=storage -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - storagedata:/data
    networks:
      - rededb

  # Container de inicialização: cria o bucket assim que o storage estiver pronto e depois encerra
  storage-init:
    image: chrislusf/seaweedfs:3.97
    container_name: storage-init
    depends_on:
      - storage
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:?Defina STORAGE_BUCKET no .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until echo "s3.bucket.list" | weed shell -master=storage:9333 > /dev/null 2>&1; do
          echo "Aguardando o storage..."; sleep 2
        done
        echo "s3.bucket.create -name $${STORAGE_BUCKET}" | weed shell -master=storage:9333 || true
        echo "Bucket '$${STORAGE_BUCKET}' pronto."
    networks:
      - rededb

volumes:
  pgdata:
  storagedata:

networks:
  rededb:
    driver: bridge

